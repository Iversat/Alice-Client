[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ls-client"
version = "0.4.2"
description = "LS Client: text, speech and local RU/EN recognition for Alice"
readme = "README.md"
authors = [{name = "Iversat"}]
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["websockets>=15,<17", "keyring>=25,<26", "python-dotenv>=1.2.2,<2"]

[project.optional-dependencies]
audio = ["PyAudio>=0.2.14,<0.3"]
voice = ["vosk>=0.3.45,<0.4", "sounddevice>=0.5,<0.6", "soundfile>=0.13,<0.15", "soxr>=0.5,<2", "faster-whisper>=1.2,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
ls-client = "alice_client.cli:main"
ls-login = "alice_client.passport_auth:main"
alice-client = "alice_client.cli:main"
alice-login = "alice_client.passport_auth:main"

[project.urls]
Repository = "https://github.com/Iversat/LS-Client"
Issues = "https://github.com/Iversat/LS-Client/issues"

[tool.setuptools]
packages = ["alice_client"]
py-modules = ["alice_client_terminal", "alice_client_receiving_tts", "alice_client_speechkit_tts", "alice_client_speechkit_asr", "yandex_login"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
